<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hubungi Kami</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;

    /* gradient lebih bagus */
    background:#FFC0CB;

    /* background image benar */
    background-image:url('bg.jpg');

    background-repeat:no-repeat;
    background-size:cover;
    background-attachment:fixed;

    animation:bgMove 10s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* HEADER */
header{
    background:#FFC0CB;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 40px;
}

.logo{
    font-size:25px;
    font-weight:700;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    transition:0.3s;
}

nav a:hover{
    color:deeppink;
}

/* FORM */
.form-container{
    width:90%;
    max-width:550px;
    margin:50px auto;

    background:rgba(255,255,255,0.15);

    backdrop-filter:blur(15px);

    padding:35px;

    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,0.3);

    color:white;
}

.form-container h1{
    text-align:center;
    margin-bottom:25px;
}

/* INPUT */
input,
textarea{
    width:100%;
    padding:14px;
    margin-top:15px;

    border:none;

    border-radius:10px;

    outline:none;

    font-size:15px;

    background:rgba(255,255,255,0.2);

    color:white;
}

/* placeholder */
input::placeholder,
textarea::placeholder{
    color:#f1f1f1;
}

textarea{
    resize:none;
    height:120px;
}

/* BUTTON */
.kirim-btn{
    width:100%;
    padding:15px;
    margin-top:20px;

    border:none;

    border-radius:12px;

    background:#2563eb;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    box-shadow:0 0 15px rgba(255,192,203,0.7);
}

.kirim-btn:hover{
    transform:scale(1.03);
    background:#16a34a;
}

/* INFO */
.info{
    margin-top:25px;
    text-align:center;
    line-height:1.8;
}

/* NAVIGASI */
.navigasi{
    text-align:center;
    margin-top:25px;
}

.navigasi button{
    padding:13px 20px;

    border:none;

    border-radius:10px;

    margin:10px;

    cursor:pointer;

    color:white;

    font-weight:bold;

    background:#2563eb;

    transition:0.3s;
}

.navigasi button:hover{
    transform:scale(1.08);
}

/* FOOTER */
footer{
    text-align:center;
    color:white;
    padding:25px;
    margin-top:40px;
    background:;
}

</style>
</head>

<body>

<!-- HEADER -->
<header>

<div class="logo">
📞 CONTACT US
</div>

<nav>
<a href="index-1.html">Home</a>
<a href="produk-1.html">Product</a>
<a href="kategori-1.html">Categories</a>
<a href="keranjang-1.html">E-Commerce</a>
<a href="login-1.html">Login</a>
</nav>

</header>

<!-- FORM -->
<section class="form-container">

<h1>Send Message</h1>

<form id="contactForm">

<input
type="text"
id="nama"
placeholder="Full Name"
required>

<input
type="email"
id="email"
placeholder="Email"
required>

<textarea
id="pesan"
placeholder="Write your message..."
required></textarea>

<button type="submit" class="kirim-btn">
Send Message
</button>

</form>

<div class="info">

<p>📍 Pekanbaru, Indonesia</p>

<p>📞 +62 853 6887 3183</p>

<p>✉️ sevenprincess@gmail.com</p>

</div>

</section>

<!-- NAVIGASI -->
<div class="navigasi">

<button
onclick="window.location.href='index-1.html'">
Home
</button>

<button
onclick="window.location.href='login-1.html'">
Login
</button>

<button
onclick="history.back()">
Back
</button>

</div>

<!-- FOOTER -->
<footer>

<h2>THE PRINCESS PALACE</h2>

<p>Website The Princess Palace</p>

</footer>

<!-- JAVASCRIPT -->
<script>

document
.getElementById("contactForm")
.addEventListener("submit",function(e){

e.preventDefault();

let nama =
document.getElementById("nama").value;

let email =
document.getElementById("email").value;

let pesan =
document.getElementById("pesan").value;

if(nama==="" || email==="" || pesan===""){

    alert("Semua form harus diisi!");

}else{

    alert("Pesan berhasil dikirim!");

    document
    .getElementById("contactForm")
    .reset();

}

});

</script>

</body>
</html>
