<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kategori Produk</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#FFC0CB;

    /* background image benar */
    background-image:url('bg.jpg');
    background-repeat:no-repeat;
    background-size:cover;
    background-attachment:fixed;
}

/* HEADER */
header{
    background:#FFC0CB;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    transition:0.3s;
}

nav a:hover{
    color:deeppink;
}

/* SEARCH */
.search-box{
    text-align:center;
    margin:30px;
}

.search-box input{
    width:350px;
    padding:12px;
    border:none;
    border-radius:8px;
}

.search-box button{
    padding:12px 20px;
    border:none;
    background:#FFC0CB;
    color:white;
    cursor:pointer;
    border-radius:8px;
}

/* JUDUL */
.judul{
    text-align:center;
    margin-top:20px;
    color:#FFC0CB;
}

/* KATEGORI */
.kategori-container{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin:40px;
}

.kategori-card{
    background:white;
    width:260px;
    padding:25px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    transition:0.3s;
}

.kategori-card:hover{
    transform:translateY(-5px);
}

.kategori-card img{
    width:120px;
    height:120px;
    object-fit:cover;
    margin-bottom:15px;
    border-radius:10px;
}

.kategori-card h2{
    margin-bottom:15px;
}

.kategori-card button{
    margin-top:10px;
    padding:10px 18px;
    border:none;
    cursor:pointer;
    border-radius:5px;
    transition:0.3s;
}

.kategori-card button:hover{
    transform:scale(1.05);
}

.lihat{
    background:pink;
    color:white;
}

.beli{
    background:#ff69b4;
    color:white;
}

/* PROMO */
.promo{
    background:#FFE8E8;
    text-align:center;
    padding:40px;
}

.promo button{
    margin-top:15px;
    padding:12px 20px;
    border:none;
    background:white;
    color:#ff69b4;
    cursor:pointer;
    border-radius:8px;
}

/* BUTTON BAWAH */
.button-bawah{
    text-align:center;
    margin:40px;
}

.kembali,
.home{
    padding:12px 20px;
    border:none;
    background:pink;
    color:white;
    cursor:pointer;
    margin:10px;
    border-radius:8px;
}

/* FOOTER */
footer{
    background:;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:50px;
}

</style>
</head>

<body>

<!-- HEADER -->
<header>

<div class="logo">
    The Princess Palace
</div>

<nav>
    <a href="index-1.html">Home</a>
    <a href="produk-1.html">Product</a>
    <a href="kategori-1.html">Categories</a>
    <a href="keranjang-1.html">E-Commerce</a>
    <a href="kontak-1.html">Contact</a>
    <a href="login-1.html">Login</a>
</nav>

</header>

<!-- SEARCH -->
<section class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search product category">

<button onclick="cariKategori()">
    Search
</button>

</section>

<!-- JUDUL -->
<h1 class="judul">
    PRODUCT CATEGORIES
</h1>

<!-- KATEGORI -->
<section class="kategori-container">

<div class="kategori-card">

    <img src="ld.png">

    <h2>Long Dress</h2>

    <button class="lihat"
    onclick="lihatKategori('Long Dress')">
        Review
    </button>

    <button class="beli"
    onclick="beliProduk('Long Dress')">
        Buy
    </button>

</div>

<div class="kategori-card">

    <img src="ts.png">

    <h2>T-Shirt</h2>

    <button class="lihat"
    onclick="lihatKategori('T-Shirt')">
        Review
    </button>

    <button class="beli"
    onclick="beliProduk('T-Shirt')">
        Buy
    </button>

</div>

<div class="kategori-card">

    <img src="csl.jpg">

    <h2>Casual</h2>

    <button class="lihat"
    onclick="lihatKategori('Casual')">
        Review
    </button>

    <button class="beli"
    onclick="beliProduk('Casual')">
        Buy
    </button>

</div>

<div class="kategori-card">

    <img src="pc.png">

    <h2>Petticoat</h2>

    <button class="lihat"
    onclick="lihatKategori('Petticoat')">
        Review
    </button>

    <button class="beli"
    onclick="beliProduk('Petticoat')">
        Buy
    </button>

</div>

</section>

<!-- PROMO -->
<section class="promo">

<h1>SPECIAL PROMO</h1>

<p>Discount up to 50%</p>

<button onclick="promo()">
    Get Promo
</button>

</section>

<!-- BUTTON -->
<div class="button-bawah">

<button class="kembali"
onclick="history.back()">
    Back
</button>

<button class="home"
onclick="window.location.href='index-1.html'">
    Home
</button>

</div>

<!-- FOOTER -->
<footer>

<h2>The Princess Palace</h2>

<p>Website The Princess Palace.</p>

</footer>

<!-- JAVASCRIPT -->
<script>

function lihatKategori(kategori){
    alert("Kategori " + kategori + " dibuka");
}

function beliProduk(produk){
    alert(produk + " berhasil dibeli");
}

function promo(){
    alert("Promo berhasil diambil");
}

function cariKategori(){

    const input =
    document.getElementById("searchInput")
    .value
    .toLowerCase();

    const cards =
    document.querySelectorAll(".kategori-card");

    cards.forEach(card => {

        const judul =
        card.querySelector("h2")
        .innerText
        .toLowerCase();

        if(judul.includes(input)){
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }

    });

}

</script>

</body>
</html>
