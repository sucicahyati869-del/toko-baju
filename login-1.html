<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Modern Login & Register</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

/* BODY */
body{
    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:linear-gradient(135deg,#FFC0CB,#FFB6C1,#FFD1DC);

    overflow:hidden;
}

/* CONTAINER */
.container{

    width:350px;

    padding:35px;

    border-radius:20px;

    background:rgba(255,255,255,0.2);

    backdrop-filter:blur(15px);

    box-shadow:0 8px 25px rgba(0,0,0,0.2);

    text-align:center;

    color:white;
}

/* JUDUL */
.container h2{
    margin-bottom:25px;
    font-size:28px;
}

/* INPUT */
input{
    width:100%;

    padding:13px;

    margin:10px 0;

    border:none;

    border-radius:10px;

    outline:none;

    background:rgba(255,255,255,0.3);

    color:white;

    font-size:15px;
}

input::placeholder{
    color:#f1f1f1;
}

/* BUTTON */
button{
    width:100%;

    padding:13px;

    margin-top:15px;

    border:none;

    border-radius:10px;

    background:#2563eb;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

button:hover{
    background:#16a34a;
    transform:scale(1.03);
}

/* TOGGLE LINK */
.toggle-link{
    margin-top:18px;
    font-size:14px;
}

.toggle-link a{
    color:yellow;
    text-decoration:none;
    font-weight:bold;
}

.toggle-link a:hover{
    text-decoration:underline;
}

/* HIDE REGISTER */
#register-form{
    display:none;
}

</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<form id="login-form">

<h2>LOGIN</h2>

<input
type="text"
placeholder="Username"
required>

<input
type="password"
placeholder="Password"
required>

<button type="submit">
ENTER
</button>

<div class="toggle-link">

Don't have an account?
<a href="#"
onclick="toggleForm()">
Register
</a>

</div>

</form>

<!-- REGISTER -->
<form id="register-form">

<h2>REGISTER</h2>

<input
type="text"
placeholder="Full Name"
required>

<input
type="email"
placeholder="Email"
required>

<input
type="password"
placeholder="Create Password"
required>

<button type="submit">
REGISTER
</button>

<div class="toggle-link">

Already have an account?
<a href="#"
onclick="toggleForm()">
Login
</a>

</div>

</form>

</div>

<script>

/* TOGGLE FORM */
function toggleForm(){

    const login =
    document.getElementById("login-form");

    const register =
    document.getElementById("register-form");

    if(login.style.display==="none"){

        login.style.display="block";
        register.style.display="none";

    }else{

        login.style.display="none";
        register.style.display="block";

    }

}

/* LOGIN */
document
.getElementById("login-form")
.addEventListener("submit",function(e){

    e.preventDefault();

    alert("Login Succesfull!");

});

/* REGISTER */
document
.getElementById("register-form")
.addEventListener("submit",function(e){

    e.preventDefault();

    alert("Registration Succesfull!");

});

</script>

</body>
</html>
